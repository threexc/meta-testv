# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-testv"
BBFILE_PATTERN_meta-testv = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-testv = "7"

LAYERDEPENDS_meta-testv = "core riscv-layer"
LAYERSERIES_COMPAT_meta-testv = "blacksail"
