DISTRO = "testv"
DISTRO_NAME = "TEST-V (RISC-V Test Distro for Yocto)"
DISTRO_VERSION = "0.1.0"
DISTRO_CODENAME = "mercury"
SDK_VENDOR = "-testvsdk"
SDK_VERSION = "${DISTRO_VERSION}"

MAINTAINER = "Trevor Gamblin <tgamblin@baylibre.com>"

TARGET_VENDOR = "-testv"

DISTRO_FEATURES ?= "${DISTRO_FEATURES_DEFAULTS}"
INIT_MANAGER = "systemd"

SDK_NAME = "${DISTRO}-${TCLIBC}-${SDKMACHINE}-${IMAGE_BASENAME}-${TUNE_PKGARCH}-${MACHINE}"
SDKPATHINSTALL = "/opt/${DISTRO}/${SDK_VERSION}"

PACKAGE_CLASSES ?= "package_rpm"

BB_SIGNATURE_HANDLER ?= "OEEquivHash"
BB_HASHSERVE ??= "auto"

# We need debug symbols so that SPDX license manifests for the kernel work.
# Same as poky default. Keep it for qemuriscv(32|64). Other BSPs will need to
# enable it on their own, unless they read it in the same way.
KERNEL_EXTRA_FEATURES:append = " features/debug/debug-kernel.scc"
